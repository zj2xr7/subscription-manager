name: Test and build Docker image

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Backend tests and frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Run backend tests
        working-directory: backend
        run: python -m unittest discover -s tests -v

      - uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        run: pnpm run build

  container:
    name: Docker build and smoke test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build smoke-test image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: subscription-manager:ci
          cache-from: type=gha,scope=subscription-manager
          cache-to: type=gha,mode=max,scope=subscription-manager

      - name: Run container health check
        shell: bash
        run: |
          docker run -d --name subscription-manager-ci -p 127.0.0.1:8000:8000 subscription-manager:ci
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          docker logs subscription-manager-ci
          exit 1

      - name: Stop smoke-test container
        if: always()
        run: docker rm -f subscription-manager-ci || true

